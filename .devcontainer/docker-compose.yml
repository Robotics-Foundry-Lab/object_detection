services:
  object_detection:
    build:
      context: ..                # build context is parent folder
      dockerfile: .devcontainer/Dockerfile
      args:
        WORKSPACE: ${WORKSPACE:-/workspace}
    runtime: nvidia
    container_name: object_detection
    network_mode: host
    privileged: true
    ipc: host
    user: root
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
      - apparmor:unconfined
    init: true # forwards docker stop to ros2 launch and reaps zombie processes
    restart: always
    environment:
      # Override per run, e.g.: RUN_MODE=bag VIS_MODE=full docker compose up
      YOLO_MODEL: ${YOLO_MODEL:-yolov8s} # yolov8n / yolov8s / yolov8m / yolov8l / yolov8x (auto-downloaded) or a custom model
      RUN_MODE: ${RUN_MODE:-standalone} # standalone (own camera) / composite (camera from realsense container) / bag (quickstart rosbag)
      VIS_MODE: ${VIS_MODE:-sparse} # sparse (person, dog, potted plant) / full (all classes) / none
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
      XDG_RUNTIME_DIR: ${XDG_RUNTIME_DIR}
      PULSE_SERVER: ${PULSE_SERVER}
      LIBGL_ALWAYS_SOFTWARE: "1"
      RMW_IMPLEMENTATION: "rmw_cyclonedds_cpp"
    volumes:
      - /dev/input:/dev/input # This is only required to recognise the joystick if it is turned on after the container started
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ../..:/workspaces:cached

    command: ["bash", "/workspaces/object_detection/entrypoint.sh"]
